name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas e2e
        run: npm run test:e2e

      - name: Compilar
        run: npm run build

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: taskmanager-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: taskmanager-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Validar nginx.conf
        run: |
          docker run --rm \
            --add-host backend-1:127.0.0.1 \
            --add-host backend-2:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.30.6-alpine nginx -t
