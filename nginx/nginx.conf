# Un solo worker para que el round-robin sea visible petición a petición
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format balanceo '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr tiempo=$upstream_response_time';
    access_log /var/log/nginx/access.log balanceo;
    error_log /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;

    # Grupo de instancias del backend NestJS (round-robin)
    upstream backend {
        server backend-1:3000;
        server backend-2:3000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
