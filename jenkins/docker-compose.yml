# Jenkins para Task Manager.  Levantar: docker compose up -d --build   Apagar: docker compose down
services:
  jenkins:
    build: .
    image: taskmanager-jenkins
    container_name: taskmanager-jenkins
    ports:
      - "8090:8080"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Define JENKINS_ADMIN_PASSWORD en jenkins/.env}
    volumes:
      - jenkins-home:/var/jenkins_home
      # Jenkins usa el Docker de esta máquina: construye y despliega aquí mismo
      - /var/run/docker.sock:/var/run/docker.sock
      # El .env de la aplicación entra como credencial de Jenkins (ver jenkins.yaml)
      - ../.env:/run/secrets/taskmanager.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "0"
    restart: unless-stopped

volumes:
  jenkins-home:
